# =============================================================================
# Source registry for the Canadian Mortgage & Housing Analytics warehouse.
#
# Every dataset the pipeline touches is declared here, never hard-coded in the
# extract scripts. This is what lets the monthly refresh be a config change
# rather than a code change, and it doubles as the data lineage document:
# for any column in the star schema you can trace back to a table number,
# a publisher, and a licence.
#
# StatCan product IDs (PIDs) were verified against the live WDS catalogue via
# `python -m src.extract.discover_sources` - see docs/source-selection.md.
# =============================================================================

statcan:
  # Web Data Service. getFullTableDownloadCSV returns a signed URL to a zip
  # containing <pid>.csv (the data) and <pid>_MetaData.csv (dimension members,
  # footnotes, units). We keep both - the metadata file is how we build
  # conformed dimensions instead of guessing at string values.
  wds_base: "https://www150.statcan.gc.ca/t1/wds/rest"

  tables:
    - pid: "34100143"
      table: "34-10-0143-01"
      alias: housing_activity_centres_10k
      publisher: CMHC
      frequency: monthly
      grain: "month x centre (10,000+) x dwelling type x construction stage"
      feeds: fact_housing_activity
      notes: >
        Primary volume driver and the DEFAULT coverage for the dashboard.
        Housing starts, units under construction and completions for centres of
        10,000+, at Canada / province / selected CMA level, back to 1948.

    - pid: "34100151"
      table: "34-10-0151-01"
      alias: housing_activity_centres_50k
      publisher: CMHC
      frequency: monthly
      grain: "month x province x dwelling type x construction stage"
      feeds: fact_housing_activity
      notes: >
        All centres of 50,000 and over. A NARROWER universe than 34-10-0143
        (10,000 and over), verified empirically - 34-10-0143 exceeds it in every
        overlapping cell. The two are nested, not duplicates, so both load under
        distinct coverage keys. See src/extract/compare_universes.py.

    - pid: "34100154"
      table: "34-10-0154-01"
      alias: housing_activity_cma
      publisher: CMHC
      frequency: monthly
      grain: "month x census metropolitan area x dwelling type x stage"
      feeds: fact_housing_activity

    - pid: "34100158"
      table: "34-10-0158-01"
      alias: housing_starts_provincial_saar
      publisher: CMHC
      frequency: monthly
      grain: "month x province"
      feeds: fact_housing_activity
      notes: >
        Province-level seasonally adjusted annual rate. Used as the
        RECONCILIATION CONTROL TOTAL - the sum of our CMA-level fact rows must
        agree with this independently published provincial series to <1%.

    - pid: "34100149"
      table: "34-10-0149-01"
      alias: absorptions_unabsorbed
      publisher: CMHC
      frequency: monthly
      grain: "month x centre x dwelling type"
      feeds: fact_market_absorption
      notes: >
        Absorptions and unabsorbed (completed but unsold) inventory. This is the
        "where are the bottlenecks" table: completions that never absorb are
        supply stuck in the pipeline.

    - pid: "34100162"
      table: "34-10-0162-01"
      alias: unoccupied_new_housing
      publisher: CMHC
      frequency: monthly
      grain: "month x CMA x dwelling type"
      feeds: fact_market_absorption

    - pid: "34100145"
      table: "34-10-0145-01"
      alias: mortgage_rate_5yr
      publisher: CMHC
      frequency: monthly
      grain: "month"
      feeds: fact_rate_environment
      notes: "Conventional 5-year mortgage lending rate, back to 1951."

    - pid: "10100006"
      table: "10-10-0006-01"
      alias: boc_lending
      publisher: Bank of Canada
      frequency: monthly
      grain: "month x lending product x new-vs-existing"
      feeds: fact_mortgage_originations
      notes: >
        Funds advanced (= originations), outstanding balances, and effective
        interest rates for residential mortgage lending. Starts 2013.

    - pid: "18100205"
      table: "18-10-0205-01"
      alias: new_housing_price_index
      publisher: Statistics Canada
      frequency: monthly
      grain: "month x geography x index component"
      feeds: fact_price_index

    - pid: "36100639"
      table: "36-10-0639-01"
      alias: household_credit_liabilities
      publisher: Statistics Canada
      frequency: monthly
      grain: "month x credit instrument"
      feeds: fact_household_credit

cba:
  # The Canadian Bankers Association publishes residential mortgage arrears
  # (90+ days) monthly back to 1995. It is the only public, long-history,
  # sub-national delinquency series in Canada - so it is worth the cost of
  # parsing a PDF. Reported for 8 regions, NOT 10 provinces; see
  # docs/geography-model.md for how that grain mismatch is handled.
  url_template: "https://cba.ca/Assets/CanadianBankersAssociation/Documents/Articles/Statistics/stat-mortgages-arrears-{month}-{year}-en.pdf"
  feeds: fact_mortgage_arrears
  regions:
    - CANADA
    - ATLANTIC
    - QUEBEC
    - ONTARIO
    - MANITOBA
    - SASKATCHEWAN
    - ALBERTA
    - BRITISH COLUMBIA
    - TERRITORIES

warehouse:
  # Local analytical engine. DuckDB runs the same star schema and (almost) the
  # same SQL as the Azure SQL deployment, so the model can be developed and
  # tested offline and promoted without a rewrite. See sql/azure/ for the
  # T-SQL deployment of the identical schema.
  duckdb_path: "data/warehouse/cmhc.duckdb"
  export_format: parquet
  export_path: "data/exports"

quality:
  # The reconciliation gate from the project brief: published figures must
  # agree with source records within 1%.
  max_variance_pct: 1.0
  fail_pipeline_on_breach: true
